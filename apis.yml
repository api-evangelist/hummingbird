aid: hummingbird
name: Hummingbird
description: 'Hummingbird is an AI-powered compliance operations platform for financial
  institutions and fintechs. It automates customer screening (sanctions, PEP, and
  adverse-media checks), transaction monitoring for financial crime, investigations
  and case management, and regulatory reporting including automated SAR, STR, and CTR
  filing. Hummingbird orchestrates risk and anti-money-laundering (AML) workflows across
  a connected app marketplace of 50+ integrations, and exposes custom two-way integration
  APIs provisioned through its partnerships team. The company is SOC 2 and ISO 27001
  certified and backed by Homebrew.'
